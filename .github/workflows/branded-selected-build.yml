# Generated by Craft Suite Manager V5. Runs ONLY when a build-select/* branch is pushed.
name: Branded SELECTIVE build
on:
  push:
    branches: ['build-select/**']
permissions:
  contents: read
concurrency:
  group: craft-selected-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos-universal:
    name: macos / universal (dmg)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS universal (ad-hoc signed, NOT notarized)
        shell: bash
        run: bash packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-macos-universal-dmg
          path: dist/release/*-macos-universal.dmg
          if-no-files-found: error
